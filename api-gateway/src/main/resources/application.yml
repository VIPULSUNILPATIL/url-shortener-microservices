server:
  port: 8765

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: shortener-service-route
          uri: lb://shortener-service
          predicates:
            - Path=/api/shorten/**
        - id: redirect-service-route
          uri: lb://redirect-service
          predicates:
            - Path=/api/redirect/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: gateway